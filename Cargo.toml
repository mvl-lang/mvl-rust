[workspace]
resolver = "2"
members = [
    "crates/mvl-rust-core",
    "crates/mvl",
    "crates/mvl-macros",
    "crates/rust-limit",
    "crates/rust-total",
    "crates/rust-refine",
    "crates/rust-effect",
    "crates/rust-ifc",
    "crates/rust-mcdc",
    "crates/cargo-mvl",
]
exclude = ["examples"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/mvl-lang/mvl-rust"
