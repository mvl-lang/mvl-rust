[package]
name = "mvl-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal proc-macro crate: no-op pass-through attributes re-exported by the `mvl` crate. Not meant to be depended on directly -- depend on `mvl` instead."
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
mvl-rust-core = { path = "../mvl-rust-core", version = "0.4.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut", "parsing", "printing", "extra-traits"] }
