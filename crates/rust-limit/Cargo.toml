[package]
name = "rust-limit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Qualified-subset lint pass for mvl-rust: rejects Rust constructs outside MVL's verifiable subset."
readme = "README.md"

[[bin]]
name = "cargo-mvl-limit"
path = "src/main.rs"

[dependencies]
mvl-rust-core = { path = "../mvl-rust-core", version = "0.1.4" }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
thiserror = "2"
serde_json = "1"
