[package]
name = "rust-refine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "#[mvl::requires]/#[mvl::ensures] refinement obligations for mvl-rust, discharged via a layered solver (native L1-L4, optional Z3-backed L5)."
readme = "README.md"

[[bin]]
name = "cargo-mvl-refine"
path = "src/main.rs"

[dependencies]
mvl-rust-core = { path = "../mvl-rust-core", version = "0.3.0" }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
thiserror = "2"
serde_json = "1"

[features]
# Passthrough (#37) -- `cargo test -p rust-refine --features z3` reaches
# mvl-rust-core's L5 dispatch without needing --manifest-path gymnastics.
z3 = ["mvl-rust-core/z3"]
