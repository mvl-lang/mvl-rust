[package]
name = "mvl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "No-op pass-through proc-macro attributes so #[mvl::total], #[mvl::requires(...)], etc. resolve on stable rustc. Verification logic lives entirely in the separate cargo mvl-* scanners (see mvl-rust-core, rust-limit) -- this crate exists only to make annotated code compile."

[lib]
proc-macro = true
