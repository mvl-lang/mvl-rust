[package]
name = "rust-ifc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "#[mvl::label]/#[mvl::relabel(...)] IFC enforcement for mvl-rust: declassification/classification only via a declared relabel."
readme = "README.md"

[[bin]]
name = "cargo-mvl-ifc"
path = "src/main.rs"

[dependencies]
mvl-rust-core = { path = "../mvl-rust-core", version = "0.5.0" }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
thiserror = "2"
serde_json = "1"
