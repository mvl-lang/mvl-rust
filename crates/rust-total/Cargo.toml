[package]
name = "rust-total"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "#[mvl::total] verifier for mvl-rust: syntactic panic-risk scan plus decreases-measure provability check."
readme = "README.md"

[[bin]]
name = "cargo-mvl-total"
path = "src/main.rs"

[dependencies]
mvl-rust-core = { path = "../mvl-rust-core", version = "0.1.4" }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
thiserror = "2"
serde_json = "1"
