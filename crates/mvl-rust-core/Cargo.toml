[package]
name = "mvl-rust-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared infrastructure for mvl-rust: attribute grammar, AST walker, diagnostics, solver bindings."
readme = "README.md"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
annotate-snippets = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0"
z3 = { version = "0.12", optional = true }

[dev-dependencies]
expect-test = "1"

[features]
# #37: L5 -- Z3 SMT dispatch for entailments L1-L4 can't close (genuine
# nonlinearity, or a linear system past L4's own complexity guards).
# Default-off: this workspace's CI has no Z3 installed by default, and
# requiring it to build at all would break every casual `cargo build`.
# Disabled, `discharge_entailment` falls through to `Runtime` exactly as
# before this feature existed -- no behavior change, no build requirement.
z3 = ["dep:z3"]
