[package]
name = "cargo-mvl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "cargo subcommand aggregating all installed mvl-rust tools (check, prove, test, mcdc, coverage, assurance)."
readme = "README.md"

[[bin]]
name = "cargo-mvl"
path = "src/main.rs"

[dependencies]
mvl-rust-core = { path = "../mvl-rust-core", version = "0.4.0" }
rust-limit = { path = "../rust-limit", version = "0.4.0" }
rust-total = { path = "../rust-total", version = "0.4.0" }
rust-refine = { path = "../rust-refine", version = "0.4.0" }
rust-effect = { path = "../rust-effect", version = "0.4.0" }
rust-ifc = { path = "../rust-ifc", version = "0.4.0" }
rust-mcdc = { path = "../rust-mcdc", version = "0.4.0" }
serde_json = "1"

[features]
# Passthrough (#37) -- lets the end-user-facing `cargo mvl` binary opt into
# L5/Z3 dispatch: `cargo build -p cargo-mvl --features z3`.
z3 = ["mvl-rust-core/z3", "rust-refine/z3"]
